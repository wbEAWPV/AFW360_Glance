# Quarto project for the AFW 360 data standard site.
#
# This is a nested project, separate from the dashboard project at the repo
# root. The root project cannot see it: Quarto skips directories whose name
# starts with "." or "_", so `.docs/` is invisible to the root `_quarto.yml`
# and the two sites never render each other's files.
#
# `render:` lists the pages explicitly, so notes such as shiny-port-plan.md
# stay out of the site.

project:
  type: website
  output-dir: _site
  render:
    - data-standard.qmd           # -> index.html (set in its own front matter)
    - 10-full-pipeline.qmd        # high-level map of the pipeline, step 0 to step 4
    - 15-legacy-verification.qmd  # step 0: the legacy dashboard as a reference
    - input-tables-findings.qmd   # -> Appendix A
    - transition.qmd              # -> Appendix B
    - sdmx-conformance.qmd        # SDMX conformance checklist with evidence
    - fmr-guide.qmd               # FMR install, load, validate, edit, export

website:
  title: "AFW 360 data standard"
  search:
    location: navbar
    type: overlay
  navbar:
    left:
      - href: data-standard.qmd
        text: "Standard"
      - href: 10-full-pipeline.qmd
        text: "Pipeline"
      - href: 15-legacy-verification.qmd
        text: "Step 0 · Legacy"
      - href: input-tables-findings.qmd
        text: "Appendix A · Input tables"
      - href: transition.qmd
        text: "Appendix B · Transition"
      - href: sdmx-conformance.qmd
        text: "SDMX conformance"
      - href: fmr-guide.qmd
        text: "FMR guide"
    right:
      - icon: github
        href: https://github.com/wbEAWPV/AFW360_Glance
        aria-label: "Source repository on GitHub"
  page-footer:
    left: "© 2026 World Bank Group"
    center: "AFW 360 data standard · draft v0.6"
    right: "[Source](https://github.com/wbEAWPV/AFW360_Glance)"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: left
    tbl-colwidths: auto
    link-external-newwindow: true
    # `embed-resources` is not supported in a website project. Each page's
    # front matter carried it; it was removed when this project was added.
